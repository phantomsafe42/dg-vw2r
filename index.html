<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blaze Black 2R Run History</title>
<style>
:root { --bg:#0b1020; --panel:#151c31; --panel2:#1d2640; --border:rgba(255,255,255,.15); --text:#f7f7fb; --muted:rgba(247,247,251,.72); --accent:#8cb4ff; --danger:#ff8c8c; --gold:#ffd76a; }
* { box-sizing:border-box; }
body { margin:0; background:linear-gradient(180deg,#080b14,#11192d); color:var(--text); font-family:Arial,sans-serif; }
a { color:var(--accent); text-decoration:none; }
.container { max-width:1100px; margin:0 auto; padding:24px; }
.nav { margin-bottom:18px; color:var(--muted); }
.hero { display:flex; gap:18px; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; box-shadow:0 12px 30px rgba(0,0,0,.25); }
.sprite { width:96px; height:96px; object-fit:contain; image-rendering:pixelated; }
h1 { margin:0; font-size:36px; }
.subtitle { color:var(--muted); margin-top:6px; line-height:1.4; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; margin-top:16px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; }
.card h2 { margin:0 0 10px 0; font-size:18px; }
.badge { display:inline-block; padding:5px 9px; border-radius:999px; border:1px solid rgba(255,215,106,.4); background:rgba(255,215,106,.12); color:var(--gold); font-weight:700; font-size:13px; margin:3px; }
.pill { display:inline-block; padding:4px 8px; border-radius:999px; border:1px solid var(--border); background:rgba(255,255,255,.07); color:var(--muted); font-size:13px; margin:3px; }
table { width:100%; border-collapse:collapse; margin-top:8px; }
th, td { border-bottom:1px solid var(--border); padding:8px; text-align:left; vertical-align:top; font-size:14px; }
th { color:var(--muted); background:rgba(255,255,255,.05); }
.death { border-color:rgba(255,140,140,.35); background:rgba(255,80,80,.08); }
.note, .small { color:var(--muted); line-height:1.45; }
.small { font-size:13px; }
.search { width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); background:#0c1223; color:var(--text); font-size:16px; margin:12px 0; }
.list { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
.list a { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; display:flex; align-items:center; gap:10px; color:var(--text); }
.list img { width:42px; height:42px; image-rendering:pixelated; object-fit:contain; }
.timeline-item { border-left:3px solid rgba(140,180,255,.55); padding:8px 10px; margin:8px 0; background:rgba(255,255,255,.05); border-radius:8px; }
.timeline-type { color:var(--accent); font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
.review { border-left-color:var(--danger); background:rgba(255,80,80,.08); }
</style>
</head>
<body><div class="container">
<div class="nav"><a href="../index.html">All games</a></div>
<section class="hero">
    <div>
        <h1>Blaze Black 2R Run History</h1>
        <div class="subtitle">Generated from 0 save source(s). 0 Pokemon page(s).</div>
        <div class="subtitle">Last generated: 2026-05-03T21:44:21.507Z</div>
    </div>
</section>
<input id="search" class="search" placeholder="Search Pokemon..." oninput="filterPokemon()">
<div class="list" id="list"></div>
<script>
function filterPokemon() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    document.querySelectorAll('.mon-link').forEach(link => {
        link.style.display = link.dataset.name.includes(q) ? 'flex' : 'none';
    });
}
</script></div></body>
</html>
